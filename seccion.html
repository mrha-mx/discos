<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Cargando sección...</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --fondo:       #0d0d0d;
    --fondo2:      #1a1a1a;
    --fondo3:      #2a2a2a;
    --borde:       #333333;
    --texto:       #f0ebe0;
    --texto-sub:   #8a8a8a;
    --acento:      #c9a84c;
    --acento-soft: rgba(201,168,76,0.10);
    --acento-brd:  rgba(201,168,76,0.25);
    --btn-bg:      #1a1a2e;
    --btn-brd:     rgba(100,130,200,0.3);
    --btn-txt:     #a8c4f0;
    --chip-bg:     #2a2a2a;
    --chip-brd:    #383838;
    --chip-txt:    #8a8a8a;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --fondo:       #f5f2ed;
      --fondo2:      #ffffff;
      --fondo3:      #ede9e2;
      --borde:       #ddd8cf;
      --texto:       #1a1610;
      --texto-sub:   #7a7068;
      --acento:      #a07830;
      --acento-soft: rgba(160,120,48,0.07);
      --acento-brd:  rgba(160,120,48,0.22);
      --btn-bg:      #e8eef8;
      --btn-brd:     rgba(80,110,180,0.25);
      --btn-txt:     #2a5abf;
      --chip-bg:     #e8e4dc;
      --chip-brd:    #d8d0c4;
      --chip-txt:    #7a7068;
    }
  }

  html { background: var(--fondo); }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--fondo);
    color: var(--texto);
    min-height: 100vh;
    max-width: 430px;
    margin: 0 auto;
    overflow-x: hidden;
  }

  /* ── LOADING ── */
  .loading-screen {
    position: fixed;
    inset: 0;
    background: var(--fondo);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    z-index: 100;
    transition: opacity 0.4s ease;
  }

  .loading-vinyl {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: radial-gradient(circle at 50%,
      #222 0%, #222 15%,
      #1a1a1a 16%, #111 22%,
      #1a1a1a 23%, #111 30%,
      #1a1a1a 31%, #111 38%,
      #1a1a1a 39%, #111 46%,
      #1a1a1a 47%, #111 50%
    );
    animation: spin 2s linear infinite;
    box-shadow: 0 0 24px rgba(201,168,76,0.2);
  }

  .loading-texto {
    font-size: 12px;
    color: var(--texto-sub);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  /* ── ERROR ── */
  .error-screen {
    display: none;
    padding: 60px 24px;
    text-align: center;
  }
  .error-titulo { font-family: 'Playfair Display', serif; font-size: 20px; margin-bottom: 10px; }
  .error-msg { font-size: 13px; color: var(--texto-sub); line-height: 1.6; }

  /* ── CONTENIDO ── */
  .main-content { display: none; }

  /* ── NAV BACK ── */
  .nav-back {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 16px 20px 0;
    text-decoration: none;
    color: var(--texto-sub);
    font-size: 13px;
    -webkit-tap-highlight-color: transparent;
    transition: color 0.15s;
  }
  .nav-back:hover { color: var(--acento); }
  .nav-back-arrow { font-size: 16px; line-height: 1; }

  /* ── LOGO ── */
  .logo-wrap {
    padding: 14px 20px 0;
    display: flex;
    justify-content: flex-end;
  }
  .logo {
    height: 26px;
    width: auto;
    filter: none;
    opacity: 0.7;
  }
  @media (prefers-color-scheme: dark) {
    .logo { filter: invert(1) brightness(0.92); }
  }

  /* ── HERO OBRA ── */
  .hero-obra {
    position: relative;
    width: 100%;
    margin-top: 16px;
  }

  .obra-img {
    width: 100%;
    height: auto;
    display: block;
  }

  .hero-overlay {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 30%;
    background: linear-gradient(to top, var(--fondo) 0%, transparent 100%);
  }

  /* ── CONTENIDO PRINCIPAL ── */
  .contenido {
    padding: 0 20px 56px;
    margin-top: 0;
    position: relative;
    z-index: 2;
  }

  /* ── NOMBRE SECCIÓN ── */
  .seccion-nombre {
    font-family: 'Playfair Display', serif;
    font-size: 34px;
    font-weight: 900;
    line-height: 1.05;
    letter-spacing: -0.02em;
    color: var(--texto);
    margin-bottom: 20px;
  }

  /* ── SEPARADOR ── */
  .sep {
    width: 100%;
    height: 1px;
    background: linear-gradient(to right, var(--acento), transparent);
    margin: 22px 0;
    opacity: 0.35;
  }

  /* ── ETIQUETA SECCIÓN ── */
  .seccion-label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--texto-sub);
    margin-bottom: 14px;
  }

  /* ── FICHA OBRA ── */
  .ficha-obra {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
    margin-bottom: 0;
  }

  .ficha-item {
    background: var(--fondo2);
    border: 1px solid var(--borde);
    border-radius: 11px;
    padding: 12px 14px;
  }

  .ficha-item.full { grid-column: 1 / -1; }

  .ficha-label {
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--texto-sub);
    margin-bottom: 4px;
    font-weight: 500;
  }

  .ficha-valor {
    font-size: 13px;
    color: var(--texto);
    line-height: 1.35;
  }

  /* ── DESCRIPCIÓN ── */
  .desc-bloque {
    background: var(--acento-soft);
    border: 1px solid var(--acento-brd);
    border-radius: 12px;
    padding: 18px 18px 18px 20px;
    position: relative;
    overflow: hidden;
  }

  .desc-bloque::before {
    content: '❝';
    position: absolute;
    top: -6px; left: 10px;
    font-size: 52px;
    color: var(--acento);
    opacity: 0.12;
    font-family: 'Playfair Display', serif;
    line-height: 1;
  }

  .desc-texto {
    font-size: 13.5px;
    line-height: 1.75;
    color: var(--texto);
    font-style: italic;
    opacity: 0.9;
    position: relative;
    z-index: 1;
  }

  /* ── SUBSECCIONES ── */
  .subsec-lista { display: flex; flex-direction: column; gap: 10px; }

  .subsec-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px;
    background: var(--fondo2);
    border: 1px solid var(--borde);
    border-radius: 14px;
    text-decoration: none;
    color: inherit;
    gap: 12px;
    -webkit-tap-highlight-color: transparent;
    transition: border-color 0.15s, background 0.15s;
  }

  .subsec-item:hover {
    border-color: var(--acento-brd);
    background: var(--acento-soft);
  }

  .subsec-nombre {
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--texto);
  }

  .subsec-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .subsec-count {
    font-size: 12px;
    color: var(--acento);
    font-weight: 500;
  }

  .subsec-arrow {
    color: var(--texto-sub);
    font-size: 14px;
    transition: transform 0.15s, color 0.15s;
  }

  .subsec-item:hover .subsec-arrow {
    transform: translateX(3px);
    color: var(--acento);
  }

  /* Item sin subsección — todos los discos */
  .subsec-item.todos {
    border-color: var(--acento-brd);
    background: var(--acento-soft);
  }

  /* ── PIE ── */
  .pie {
    text-align: center;
    margin-top: 36px;
    padding-top: 20px;
    border-top: 1px solid var(--borde);
  }
  .pie-logo {
    height: 20px;
    width: auto;
    opacity: 0.25;
    filter: none;
  }
  @media (prefers-color-scheme: dark) {
    .pie-logo { filter: invert(1); }
  }
</style>
</head>
<body>

<div class="loading-screen" id="loading">
  <div class="loading-vinyl"></div>
  <div class="loading-texto">Cargando sección...</div>
</div>

<div class="error-screen" id="error">
  <div class="error-titulo">Sección no encontrada</div>
  <div class="error-msg" id="error-msg">No se pudo cargar la información de esta sección.</div>
</div>

<div class="main-content" id="main">

  <a href="index.html" class="nav-back">
    <span class="nav-back-arrow">‹</span>
    <span>Mi Colección</span>
  </a>

  <div class="logo-wrap">
    <img src="logo.PNG" alt="Miguel Herrería" class="logo">
  </div>

  <div class="hero-obra">
    <img id="obra-img" class="obra-img" src="" alt="">
    <div class="hero-overlay"></div>
  </div>

  <div class="contenido">

    <div class="seccion-nombre" id="seccion-nombre"></div>

    <div class="sep"></div>

    <!-- FICHA TÉCNICA DE LA OBRA -->
    <div class="seccion-label">Obra</div>
    <div class="ficha-obra" id="ficha-obra"></div>

    <div class="sep"></div>

    <!-- DESCRIPCIÓN -->
    <div class="seccion-label">Por qué esta obra</div>
    <div class="desc-bloque">
      <div class="desc-texto" id="descripcion"></div>
    </div>

    <div class="sep"></div>

    <!-- SUBSECCIONES / DISCOS -->
    <div class="seccion-label" id="label-discos">Explorar</div>
    <div class="subsec-lista" id="subsec-lista"></div>

    <div class="pie">
      <img src="logo.PNG" alt="" class="pie-logo">
    </div>

  </div>
</div>

<script>
const SHEET_SECCIONES = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSgCg_wULbvtaSSgau8IoZuIVGabPO7g73VwV6ftPhhT39MBLEpQ14G518A5IBPPqrndtP40xAjMsgS/pub?gid=2056673892&single=true&output=csv';
const SHEET_INDEX     = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSgCg_wULbvtaSSgau8IoZuIVGabPO7g73VwV6ftPhhT39MBLEpQ14G518A5IBPPqrndtP40xAjMsgS/pub?gid=2086226810&single=true&output=csv';

const SECCION_NOMBRE_EXCEL = {
  'rock':                 'Rock',
  'pop-internacional':    'Pop Internacional',
  'cancion-romantica':    'Canción Romántica',
  'soul-jazz':            'Soul/Jazz/Hip-Hop & Más',
  'musica-mexicana':      'Música Mexicana',
  'musica-del-mundo':     'Música del Mundo',
  'clasica-orquestas':    'Clásica & Orquestas',
  'ritmos-latinos':       'Ritmos Latinos',
  'musica-infantil':      'Música Infantil',
  'bandas-sonoras':       'Bandas Sonoras',
  'electronica-house':    'Electrónica & House',
  'experimental-new-age': 'Experimental & New Age'
};

function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = lines[0].split(',').map(h => h.replace(/^"|"$/g, '').trim());
  return lines.slice(1).map(line => {
    const values = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      if (line[i] === '"') { inQuotes = !inQuotes; }
      else if (line[i] === ',' && !inQuotes) { values.push(current.trim()); current = ''; }
      else { current += line[i]; }
    }
    values.push(current.trim());
    const obj = {};
    headers.forEach((h, i) => obj[h] = values[i] || '');
    return obj;
  });
}

function getParam(name) {
  return new URLSearchParams(window.location.search).get(name);
}

async function cargar() {
  const id = getParam('id');
  if (!id) { mostrarError('No se especificó sección.'); return; }

  try {
    const [resSec, resIdx] = await Promise.all([
      fetch(SHEET_SECCIONES),
      fetch(SHEET_INDEX)
    ]);
    const [textSec, textIdx] = await Promise.all([resSec.text(), resIdx.text()]);
    const secciones = parseCSV(textSec);
    const discos    = parseCSV(textIdx);

    const sec = secciones.find(s => s.seccion_id === id);
    if (!sec) { mostrarError('Sección no encontrada.'); return; }

    // Título
    document.title = sec.nombre + ' — Mi Colección';
    document.getElementById('seccion-nombre').textContent = sec.nombre;

    // Obra de arte
    document.getElementById('obra-img').src = sec.archivo_imagen;
    document.getElementById('obra-img').alt = sec.obra_titulo;

    // Ficha técnica
    const ficha = document.getElementById('ficha-obra');
    const campos = [
      { label: 'Artista',    valor: sec.obra_artista,   full: false },
      { label: 'Año',        valor: sec.obra_año,        full: false },
      { label: 'Título',     valor: sec.obra_titulo,    full: true  },
      { label: 'Técnica',    valor: sec.obra_tecnica,   full: false },
      { label: 'Colección',  valor: sec.obra_coleccion, full: false },
    ];
    campos.forEach(c => {
      if (!c.valor) return;
      const div = document.createElement('div');
      div.className = 'ficha-item' + (c.full ? ' full' : '');
      div.innerHTML = `<div class="ficha-label">${c.label}</div><div class="ficha-valor">${c.valor}</div>`;
      ficha.appendChild(div);
    });

    // Descripción
    document.getElementById('descripcion').textContent = sec.descripcion;

    // Filtrar discos de esta sección desde discos_index
    const nombreExcel = SECCION_NOMBRE_EXCEL[id] || sec.nombre;
    const discosSeccion = discos.filter(d => (d['seccion'] || '').trim() === nombreExcel);

    // Subsecciones únicas
    const subs = [...new Set(
      discosSeccion
        .map(d => (d['subseccion'] || '').trim())
        .filter(s => s)
    )].sort();

    const lista = document.getElementById('subsec-lista');

    if (subs.length === 0) {
      document.getElementById('label-discos').textContent = `${discosSeccion.length} discos`;
      const a = document.createElement('a');
      a.className = 'subsec-item todos';
      a.href = `subseccion.html?seccion=${encodeURIComponent(id)}&sub=todos`;
      a.innerHTML = `
        <div class="subsec-nombre">Ver todos los discos</div>
        <div class="subsec-meta">
          <span class="subsec-count">${discosSeccion.length}</span>
          <span class="subsec-arrow">›</span>
        </div>`;
      lista.appendChild(a);
    } else {
      document.getElementById('label-discos').textContent = 'Subsecciones';
      subs.forEach(sub => {
        const count = discosSeccion.filter(d => (d['subseccion'] || '').trim() === sub).length;
        const a = document.createElement('a');
        a.className = 'subsec-item';
        a.href = `subseccion.html?seccion=${encodeURIComponent(id)}&sub=${encodeURIComponent(sub)}`;
        a.innerHTML = `
          <div class="subsec-nombre">${sub}</div>
          <div class="subsec-meta">
            <span class="subsec-count">${count}</span>
            <span class="subsec-arrow">›</span>
          </div>`;
        lista.appendChild(a);
      });

      // Discos sin subsección
      const sinSub = discosSeccion.filter(d => !(d['subseccion'] || '').trim()).length;
      if (sinSub > 0) {
        const a = document.createElement('a');
        a.className = 'subsec-item';
        a.href = `subseccion.html?seccion=${encodeURIComponent(id)}&sub=todos`;
        a.innerHTML = `
          <div class="subsec-nombre">Otros</div>
          <div class="subsec-meta">
            <span class="subsec-count">${sinSub}</span>
            <span class="subsec-arrow">›</span>
          </div>`;
        lista.appendChild(a);
      }
    }

    // Mostrar
    document.getElementById('loading').style.opacity = '0';
    setTimeout(() => {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('main').style.display = 'block';
    }, 400);

  } catch(e) {
    mostrarError('Error al cargar los datos. Intenta recargar.');
  }
}

function mostrarError(msg) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('error-msg').textContent = msg;
  document.getElementById('error').style.display = 'block';
}

cargar();
</script>
</body>
</html>
